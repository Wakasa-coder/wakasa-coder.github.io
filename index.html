<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jd</title>
    <style>
      *{
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      body{
        background: #0a0a0a;
        color: white;
        font-family: Sans-Serif;
      }
      #intro{
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
      }
      #intro-name{
        font-size: 60px;
        color: #BE2FBE;
        animation: glow 2s ease-in-out forwards;
        text-shadow: 0 0 40px #BE2FBE;
      }
      @keyframes glow{
        from{
          opacity: 0;
          text-shadow: none;
        }
        to{
          opacity: 1;
          text-shadow: 0 0 40px #BE2FBE;
        }
      }
      #intro-tag{
        font-size: 20px;
        color: #7B2FBE;
        opacity: 0;
        margin-top: 10px;
        animation: glow 2s ease-in-out 1s forwards;
      }
      #home{
        text-align: center;
        margin-top: 100px;
      }
      nav{
        display: none;
        text-align: center;
        padding: 15px;
        border-bottom: 2px solid #7B2FBE;
        box-shadow: 0 0 30px #7B2FBE;
      }
      nav a{
        color: #BE2FBE;
        text-decoration: none;
        margin: 0 20px;
      }
      #home{
        text-align: center;
        margin-top: 100px;
      }
      h1{
        font-size: 48px;
        color: #BE2FBE;
        text-shadow: 0 0 30px #BE2FBE;
      }
      p{
        font-size: 20px;
        color: #7B2FBE;
        margin-top: 10px;
      }
      #hirebtn{
        margin-top: 20px;
        padding: 10px 30px;
        background: transperent;
        border: 2px solid #BE2FBE;
        color: #BE2FBE;
        cursor: pointer;
        font-size: 16px;
        border-radius: 25px;
        box-shadow: 0 0 15px #BE2FBE;
      }
      #hirebtn:hover{
        background: #BE2FBE;
        color: black;
        box-shadow: 0 0 40px;
        transition: all 0.4s ease;
      }
      #skills{
        text-align: center;
        margin-top:80px;
      }
      h2{
        font-size: 36px;
        color: #BE2FBE;
        text-shadow: 0 0 20px #BE2FBE;
        margin-bottom: 30px;
      }
      .skill{
        width: 60%;
        margin: 15px auto;
        text-align: left;
      }
      .bar-track{
        width: 100%;
        height: 10px;
        background: rgba(255,255,255,0.1);
      }
      .bar-fill{
        height: 100%;
        width: var(--target);
        background: linear-gradient(90deg, #7B2FBE, #BE2FBE);
        box-shadow: 0 0 10px #BE2FBE;
        border-radius: 10px;
      }
      .projects-grid{
        display:grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        padding: 20px;
        max-width:90%;
        margin:0 auto;
      }
      .projects-grid img{
        width: 100%;
      }
      #projects {
      text-align: center;
      margin-top: 80px;
      }
      #contact{
        text-align: center;
        margin-top: 80px;
        padding:50px;
      }
      #contact a {
        color: #BE2FBE;
        text-decoration: none;
        margin: 0 20px;
        font-size: 18px;
        border: 2px solid #BE2FBE;
        padding: 10px 25px;
        border-radius: 25px;
        box-shadow: 0 0 15px #BE2FBE;
      }
      #contact a:hover {
        background: #BE2FBE;
        color: black;
        transition: all 0.3s ease;
      }
      #contact p {
        margin-bottom: 20px; 
      }
    </style>
  </head>
  <body>
    <div id="intro">
      <h1 id="intro-name">Wakasa</h1>
      <p id="intro-tag">One Man Army Dev</p>
    </div>
    <nav>
      <a href="#home">Home</a>
      <a href="#skills">Skills</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </nav>
    <section id="home">
      <h1>Wakasa here bro</h1>

    </section>
    <section id="skills">
        <h2>My Skills</h2>
        <div class="skill">
        <p>HTML - 80%</p>
        <div class="bar-track">
        <div class="bar-fill" style="--target: 80%"></div>
         </div>
        </div>
        <div class="skill">
        <p>CSS - 70%</p>
        <div class="bar-track">
        <div class="bar-fill" style="--target: 70%"></div>
         </div>
        </div>
        <div class="skill">
        <p>JAVASCRIPT - 65%</p>
        <div class="bar-track">
        <div class="bar-fill" style="--target: 65%"></div>
         </div>
        </div>
        <div class="skill">
        <p>FETCH API - 60%</p>
        <div class="bar-track">
        <div class="bar-fill" style="--target: 60%"></div>
         </div>
        </div>
    </section>
    <section id="projects">
       <h2>My Projects</h2>
        <div class="projects-grid">
          <img src="project0.jpg" width="230"alt="" />
          <img src="project1.jpg" width="230"alt="" />
          <img src="project2.jpg" width="230"alt="" />
          <img src="project3.jpg" width="230"alt="" />
          <img src="project4.jpg" width="230"alt="" />
          <img src="project5.jpg" width="230"alt="" />
          <img src="project6.jpg" width="230"alt="" />
          <img src="project7.jpg" width="230"alt="" />
          <img src="project8.jpg" width="230"alt="" />
          <img src="project9.jpg" width="230"alt="" />
          <img src="project10.jpg" width="230"alt="" />
          <img src="project11.jpg" width="230"alt="" />
          <img src="project12.jpg" width="230"alt="" />
        </div>
    </section>
    <section id="contact">
      <h2>Contact Me</h2>
      <p>prem182474@gmail.com</p>
      <a href="https://github.com/Wakasa-coder">GitHub</a>
      <a href="#">LinkedIn</a>
    </section>
    
    <script>
      setTimeout(function() {
        document.getElementById("intro").style.opacity = "0"
        document.getElementById("intro").style.transition = "opacity 1s ease"
      },3000 );
      
      setTimeout(function() {
        document.getElementById("intro").style.display = "none"
        document.querySelector("nav").style.display = "block"
      }, 4000);
    </script>
  </body>
</html>
